# Connect this repository to Render as a Web Service or Blueprint.
services:
  - type: web
    name: glucolab-public-beta
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: GLUCOLAB_PUBLIC
        value: "1"
